# SPDX-License-Identifier: GPL-3.0-or-later WITH LicenseRef-cardkit-ads-exception
# Initial CI, scoped to the modules that exist (:engine, :ai, :shared). As :app/:web land this
# grows into the full pipeline mirrored from the 500 repo: flavors, web dist + Playwright e2e,
# emulator suite, FOSS-purity gate, and the tag-triggered release / verify-reproducible /
# publish-release / deploy-web jobs.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive   # pulls in the cardkit submodule

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Static analysis (detekt + CPD)
        run: ./gradlew qualityCheck

      - name: Unit tests (engine + ai)
        run: ./gradlew :engine:jvmTest :ai:jvmTest

      - name: Coverage verification (engine + ai)
        run: ./gradlew :engine:koverVerify :ai:koverVerify

      # The UI module's own tests: the ViewModel/pacing contract, settings persistence, sound
      # triggers and the pure table helpers. They need no emulator (nothing touches the Android
      # framework), so they run in the same job.
      - name: Unit tests (shared UI)
        run: ./gradlew :shared:testDebugUnitTest

      - name: wasmJs compiles (engine + ai + shared)
        run: ./gradlew :engine:compileKotlinWasmJs :ai:compileKotlinWasmJs :shared:compileKotlinWasmJs

      - name: Upload quality reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          path: |
            **/build/reports/detekt/
            **/build/reports/cpd/
          if-no-files-found: ignore
