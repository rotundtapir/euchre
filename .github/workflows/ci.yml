name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive   # pulls in the cardkit submodule

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Static analysis (detekt + CPD)
        run: ./gradlew qualityCheck

      - name: Unit tests (engine + ai + net + server) and lint
        run: ./gradlew :engine:jvmTest :ai:jvmTest :net:jvmTest :server:test lint

      - name: Coverage verification (engine + ai + net)
        run: ./gradlew :engine:koverVerify :ai:koverVerify :net:koverVerify

      # The UI module's own tests: the ViewModel/pacing contract, settings persistence, sound
      # triggers and the pure table helpers. They need no emulator (nothing touches the Android
      # framework), so they run in the same job.
      - name: Unit tests (shared UI)
        run: ./gradlew :shared:testDebugUnitTest

      - name: Assemble both flavors (debug)
        run: ./gradlew assembleFossDebug assemblePlayDebug

      - name: Build web distribution (wasmJs)
        run: ./gradlew :web:wasmJsBrowserDistribution

      # online.spec.ts boots this and talks to it over a real WebSocket. It is the only stage that
      # exercises the wasm client against the server — the JVM suites cannot see a wasm-only
      # serialization failure, and one reached 500 exactly that way.
      - name: Build the game server (for the online e2e)
        run: ./gradlew :server:installDist

      # E2E smoke of the production wasm artifact: served under a /euchre/ prefix (the Pages
      # subpath), driven with Playwright against the runner's Chrome (WasmGC-capable).
      - name: Web E2E (Playwright)
        working-directory: web/e2e
        run: |
          npm ci
          npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/e2e/playwright-report
            web/e2e/test-results
          if-no-files-found: ignore

      - name: Upload quality reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          path: |
            **/build/reports/detekt/
            **/build/reports/cpd/
          if-no-files-found: ignore

      # The F-Droid gate: the FOSS build graph must not reach a proprietary dependency. Checked on
      # the RELEASE classpath, which is what actually ships.
      - name: Verify FOSS build has no proprietary deps
        run: |
          ./gradlew :app:dependencies --configuration fossReleaseRuntimeClasspath > foss-deps.txt
          if grep -Eq 'com\.google\.android\.gms|com\.android\.billingclient|firebase|cardkit-monetization-play' foss-deps.txt; then
            echo "::error::FOSS build graph contains a proprietary dependency"; exit 1
          fi

      # PRIVACY.md is specific about what the FOSS build may do, and permissions are how that is
      # enforced on the artifact rather than in the source. Online play needs INTERNET, so this is an
      # allowlist rather than the flat "no permissions" gate it replaces: INTERNET must be present
      # (its absence would mean a lost manifest change, i.e. a build that cannot play online), and
      # anything else has to be added here deliberately, in review, with PRIVACY.md updated to match.
      - name: Verify the FOSS APK requests only the permissions we allow
        run: |
          AAPT2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)"
          "$AAPT2" dump permissions app/build/outputs/apk/foss/debug/app-foss-debug.apk > foss-perms.txt
          cat foss-perms.txt
          sed -n "s/^ *uses-permission: name='\([^']*\)'.*/\1/p" foss-perms.txt | sort -u > got.txt
          # The allowlist. INTERNET is online play. The DYNAMIC_RECEIVER_NOT_EXPORTED one is
          # app-scoped and injected by AndroidX: it is how androidx.core keeps its dynamically
          # registered broadcast receivers from being world-accessible, so it grants this app no
          # capability over the device and is not privacy-relevant. It was already in every build —
          # the previous gate only grepped for INTERNET, so it never had cause to mention it.
          printf '%s\n' \
            android.permission.INTERNET \
            io.github.rotundtapir.euchre.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION \
            | sort -u > allowed.txt
          if ! grep -qx 'android.permission.INTERNET' got.txt; then
            echo "::error::the FOSS APK does not request INTERNET — online play would not work"; exit 1
          fi
          if ! diff -u allowed.txt got.txt; then
            echo "::error::the FOSS APK requests a permission outside the allowlist — see PRIVACY.md"; exit 1
          fi

  # On-device (emulator) integration suite, so the Android side gates merges the way the web e2e
  # does. `-no-audio` is why the fixture pins SOUND_VOLUME=0: native playback crashes the
  # instrumented process on a runner with no audio device.
  android-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Connected tests (emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          # Phone-sized screen: the runner's default AVD is small enough that below-the-fold
          # content (the settings dialog's tail rows) fails assertIsDisplayed/click.
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -no-snapshot
          disable-animations: true
          # TutorialFrameCapture is a motion-capture harness, not an assertion suite: it films the
          # app at SLOW speed for a human (or an agent) to read back. It would spend a minute here
          # writing PNGs nobody collects, and this job disables animations anyway.
          script: >-
            ./gradlew :app:connectedFossDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.notClass=io.github.rotundtapir.euchre.TutorialFrameCapture

      - name: Upload connected-test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: connected-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6

      # Signing secrets (configure in repo settings):
      #   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release artifacts
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:bundlePlayRelease :app:assembleFossRelease

      # Publishing happens in publish-release, behind the verify-reproducible gate below.
      - name: Upload FOSS APK for verification and publishing
        uses: actions/upload-artifact@v7
        with:
          name: foss-release-apk
          path: app/build/outputs/apk/foss/release/app-foss-release.apk
          if-no-files-found: error

      # The play AAB is for the Play Console, not for sideloading: expose it as a private
      # workflow artifact (Actions -> run -> Artifacts) rather than on the public release.
      - name: Upload play AAB as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: play-release-aab
          path: app/build/outputs/bundle/playRelease/*.aab
          if-no-files-found: error

  # Reproducibility gate: rebuild the FOSS APK on a fresh runner and require it to match the signed
  # APK byte-for-byte before anything is published. The rebuild is deliberately different in shape
  # from the release build — a full clone (what F-Droid's buildserver does, vs the shallow release
  # checkout; this exercises the GIT_COMMIT --short=8 pin) and no Gradle build cache (restored cache
  # entries would let the "independent" rebuild reuse the release job's outputs and mask
  # nondeterminism). `apksigcopier compare` is the same check fdroidserver runs against Binaries:,
  # so a green job means F-Droid can reproduce the published APK.
  verify-reproducible:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      # No gradle/actions/setup-gradle here — see the job comment.

      - name: Rebuild FOSS APK (unsigned, no build cache)
        run: ./gradlew --no-build-cache :app:assembleFossRelease

      - name: Download signed APK
        uses: actions/download-artifact@v8
        with:
          name: foss-release-apk
          path: signed

      - name: Compare rebuild to signed APK (signature-aware)
        run: |
          pipx install apksigcopier
          export PATH="$ANDROID_HOME/build-tools/36.0.0:$PATH"   # apksigcopier shells out to apksigner
          sha256sum signed/app-foss-release.apk app/build/outputs/apk/foss/release/app-foss-release-unsigned.apk
          apksigcopier compare signed/app-foss-release.apk \
            --unsigned app/build/outputs/apk/foss/release/app-foss-release-unsigned.apk
          echo "reproducible: rebuild matches the signed APK"

  publish-release:
    needs: verify-reproducible
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the GitHub release and upload the APK
    steps:
      - name: Download verified APK
        uses: actions/download-artifact@v8
        with:
          name: foss-release-apk

      - name: Publish GitHub release (FOSS APK)
        uses: softprops/action-gh-release@v3
        with:
          files: app-foss-release.apk

  # The playable web build (Kotlin/Wasm) goes to GitHub Pages on the same v* tags as the Android
  # release, so the hosted game tracks releases rather than every push to main.
  # One-time repo setting: Settings -> Pages -> Source = "GitHub Actions".
  deploy-web:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      pages: write      # deploy to GitHub Pages
      id-token: write   # OIDC token for the pages deployment
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      # settings.gradle.kts configures the Android modules even for :web tasks.
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6

      - name: Build web distribution
        run: ./gradlew :web:wasmJsBrowserDistribution

      # Actions-sourced Pages deployments skip Jekyll anyway; this is belt-and-braces in case
      # the Pages source is ever switched back to a branch.
      - name: Disable Jekyll
        run: touch web/build/dist/wasmJs/productionExecutable/.nojekyll

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/build/dist/wasmJs/productionExecutable
      - id: deployment
        uses: actions/deploy-pages@v5

  # Build the server image and push it to GHCR on a release tag. The dist is built with Gradle (cache
  # reuse) then copied into a thin image; multi-arch so self-hosters on ARM (Raspberry Pi) can pull.
  publish-server-image:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to GHCR
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build server distribution
        run: ./gradlew :server:installDist
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/rotundtapir/euchre-server
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  # Deploy to the VPS the 500 server already runs on. Euchre owns its own compose project and exactly
  # one file in the shared /opt/caddy-sites; TLS and routing come from the Caddy in 500's project.
  # Secrets: DEPLOY_SSH_KEY, DEPLOY_HOST (the IP), DEPLOY_PORT, DEPLOY_KNOWN_HOSTS.
  deploy-server:
    needs: publish-server-image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Two euchre tags pushed close together must not interleave pin/up on the same box.
    concurrency:
      group: deploy-server
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Sync deploy files
        run: |
          rsync -e "ssh -p ${{ secrets.DEPLOY_PORT }} -i ~/.ssh/id_ed25519" -av \
            server/deploy/docker-compose.yml \
            root@${{ secrets.DEPLOY_HOST }}:/opt/euchre-server/
          # Only euchre's vhost. The shared Caddy imports every file in this directory and each game
          # owns one, so this must never touch 500's.
          rsync -e "ssh -p ${{ secrets.DEPLOY_PORT }} -i ~/.ssh/id_ed25519" -av \
            server/deploy/sites/euchre.caddy \
            root@${{ secrets.DEPLOY_HOST }}:/opt/caddy-sites/
      - name: Pin version and bring up
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ssh -p "${{ secrets.DEPLOY_PORT }}" -i ~/.ssh/id_ed25519 root@"${{ secrets.DEPLOY_HOST }}" bash -s <<EOF
          set -e
          cd /opt/euchre-server
          # No drain-and-wait: room snapshots (DATA_DIR) survive the restart and clients reconnect
          # into their seats. A deploy that bumps the snapshot schema version must drain MANUALLY
          # first so games finish on the old code — see 500's docs/server-runbook.md.
          touch .env
          grep -q '^IMAGE_TAG=' .env || echo 'IMAGE_TAG=latest' >> .env
          sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${VERSION}/" .env
          docker compose pull server
          docker compose up -d --wait
          # Unconditional undrain: a fresh container starts undrained (no-op), but a same-version
          # re-run leaves the old container in place, and if that one was drained it would refuse
          # every new lobby while /health still 200s and CI goes green.
          docker exec euchre-server wget -qO- --post-data='' http://localhost:8080/admin/undrain || true
          # Pick up this game's vhost. Caddy lives in 500's compose project, so go via the container
          # name rather than `docker compose exec`.
          docker exec 500-caddy caddy reload --config /etc/caddy/Caddyfile || true
          EOF
      - name: Verify the deployment is serving
        run: |
          for i in $(seq 1 12); do
            if curl -fsS https://euchre.29022617.xyz/health | tee /dev/stderr | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::euchre server did not become healthy"; exit 1
